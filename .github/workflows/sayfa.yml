# Oyunun tarayıcı sürümünü gh-pages dalına koyar; GitHub Pages oradan yayınlar.
name: Web sürümü

on:
  push:
    branches: ["main"]
    paths: ["www/**", ".github/workflows/sayfa.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          publish_branch: gh-pages
          enable_jekyll: false
          commit_message: "Web sürümü güncellendi"
